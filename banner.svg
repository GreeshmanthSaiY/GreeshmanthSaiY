<svg viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#161b32"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A5B4FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .node { animation: pulse 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .n1 { animation-delay: 0s; }
    .n2 { animation-delay: -0.6s; }
    .n3 { animation-delay: -1.2s; }
    .n4 { animation-delay: -1.8s; }
    .n5 { animation-delay: -2.4s; }
    .n6 { animation-delay: -3s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.4); }
    }
    .scan { animation: sweep 7s linear infinite; }
    @keyframes sweep {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(1300px); }
    }
    .shield { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.4; }
    }
    .phrase { opacity: 0; animation: cycle 12s infinite; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: -3s; }
    .p3 { animation-delay: -6s; }
    .p4 { animation-delay: -9s; }
    @keyframes cycle {
      0% { opacity: 0; }
      3% { opacity: 1; }
      22% { opacity: 1; }
      28% { opacity: 0; }
      100% { opacity: 0; }
    }
    .ttl, .sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .tag { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- abstract shield watermark -->
    <g class="shield" transform="translate(1080,165)">
      <path d="M0,-78 L58,-50 L58,18 Q58,58 0,90 Q-58,58 -58,18 L-58,-50 Z"
            fill="none" stroke="#818CF8" stroke-width="2"/>
      <path d="M-22,8 L-6,26 L26,-18" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- distributed network motif, left cluster -->
    <g stroke="#334155" stroke-width="1">
      <line x1="120" y1="286" x2="222" y2="266"/>
      <line x1="222" y1="266" x2="318" y2="300"/>
    </g>
    <circle class="node n1" cx="120" cy="286" r="3.4" fill="#818CF8"/>
    <circle class="node n2" cx="222" cy="266" r="3.4" fill="#818CF8"/>
    <circle class="node n3" cx="318" cy="300" r="3.4" fill="#818CF8"/>

    <!-- distributed network motif, right cluster -->
    <g stroke="#334155" stroke-width="1">
      <line x1="862" y1="272" x2="954" y2="250"/>
      <line x1="954" y1="250" x2="1042" y2="292"/>
    </g>
    <circle class="node n4" cx="862" cy="272" r="3.4" fill="#A5B4FC"/>
    <circle class="node n5" cx="954" cy="250" r="3.4" fill="#A5B4FC"/>
    <circle class="node n6" cx="1042" cy="292" r="3.4" fill="#A5B4FC"/>

    <!-- scanning sweep -->
    <rect class="scan" x="0" y="0" width="160" height="320" fill="url(#scanGrad)" opacity="0.5"/>

    <!-- name -->
    <text x="60" y="148" class="ttl" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">GREESHMANTH SAI YARRAMREDDY</text>

    <!-- static subtitle -->
    <text x="60" y="186" class="tag" font-size="17" fill="#94A3B8" letter-spacing="0.5">AI Systems Engineer · Full-Stack Developer · Applied AI Researcher</text>

    <!-- cycling tagline -->
    <text x="60" y="234" class="tag phrase p1" font-size="20" fill="#A5B4FC">Building Government-Scale Digital Platforms</text>
    <text x="60" y="234" class="tag phrase p2" font-size="20" fill="#A5B4FC">Cybersecurity Intelligence · PU Learning + XGBoost</text>
    <text x="60" y="234" class="tag phrase p3" font-size="20" fill="#A5B4FC">Deep Learning Research · Evolutionary CNN Pruning</text>
    <text x="60" y="234" class="tag phrase p4" font-size="20" font-weight="600" fill="#818CF8">Learn. Adapt. Build. Repeat.</text>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>
  </g>
</svg>
