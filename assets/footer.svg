<svg viewBox="0 0 1200 130" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1224"/>
      <stop offset="50%" stop-color="#161b32"/>
      <stop offset="100%" stop-color="#0d1224"/>
    </linearGradient>
    <linearGradient id="scanGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A5B4FC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frameF">
      <rect x="0" y="0" width="1200" height="130" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .scanF { animation: sweepF 8s linear infinite; }
    @keyframes sweepF {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(1300px); }
    }
    .node { animation: pulseF 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .nf1 { animation-delay: 0s; } .nf2 { animation-delay: -1.2s; } .nf3 { animation-delay: -2.4s; }
    @keyframes pulseF {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }
  </style>
  <g clip-path="url(#frameF)">
    <rect width="1200" height="130" fill="url(#bgGradF)"/>
    <rect class="scanF" x="0" y="0" width="180" height="130" fill="url(#scanGradF)"/>
    <circle class="node nf1" cx="90" cy="100" r="3" fill="#818CF8"/>
    <circle class="node nf2" cx="1110" cy="32" r="3" fill="#818CF8"/>
    <circle class="node nf3" cx="1150" cy="100" r="3" fill="#818CF8"/>
    <text x="600" y="58" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#F8FAFC">LEARN. ADAPT. BUILD. REPEAT.</text>
    <text x="600" y="86" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">Because growth belongs to those who never stop doing all four.</text>
    <rect x="0.5" y="0.5" width="1199" height="129" rx="14" fill="none" stroke="#1E293B" stroke-width="1"/>
  </g>
</svg>
