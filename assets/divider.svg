<svg viewBox="0 0 1200 28" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dot { animation: travel 5s linear infinite; }
    .dot1 { animation-delay: 0s; }
    .dot2 { animation-delay: -1.7s; }
    .dot3 { animation-delay: -3.3s; }
    @keyframes travel {
      0%   { transform: translateX(-20px); opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(1220px); opacity: 0; }
    }
  </style>
  <rect x="0" y="13" width="1200" height="2" fill="url(#lineGrad)"/>
  <circle class="dot dot1" cx="0" cy="14" r="3" fill="#A5B4FC"/>
  <circle class="dot dot2" cx="0" cy="14" r="3" fill="#A5B4FC"/>
  <circle class="dot dot3" cx="0" cy="14" r="3" fill="#A5B4FC"/>
</svg>
