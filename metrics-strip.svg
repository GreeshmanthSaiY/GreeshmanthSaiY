<svg viewBox="0 0 1000 230" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #CBD5E1; }
    .val { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 14px; font-weight: 700; fill: #C7D2FE; }
    .track { fill: #1E293B; }
    .fillwrap { transform-box: fill-box; transform-origin: 0% 50%; }
    .barA { animation: fillA 5s ease-in-out infinite; }
    .barB { animation: fillB 5s ease-in-out infinite; animation-delay: -0.4s; }
    .barC { animation: fillC 5s ease-in-out infinite; animation-delay: -0.8s; }
    .barD { animation: fillD 5s ease-in-out infinite; animation-delay: -1.2s; }
    @keyframes fillA { 0%{transform:scaleX(0);} 45%{transform:scaleX(0.93);} 88%{transform:scaleX(0.93);} 96%{transform:scaleX(0);} 100%{transform:scaleX(0);} }
    @keyframes fillB { 0%{transform:scaleX(0);} 45%{transform:scaleX(0.60);} 88%{transform:scaleX(0.60);} 96%{transform:scaleX(0);} 100%{transform:scaleX(0);} }
    @keyframes fillC { 0%{transform:scaleX(0);} 45%{transform:scaleX(0.40);} 88%{transform:scaleX(0.40);} 96%{transform:scaleX(0);} 100%{transform:scaleX(0);} }
    @keyframes fillD { 0%{transform:scaleX(0);} 45%{transform:scaleX(0.45);} 88%{transform:scaleX(0.45);} 96%{transform:scaleX(0);} 100%{transform:scaleX(0);} }
  </style>

  <!-- Row 1 -->
  <text x="20" y="30" class="lbl">Phishing Detection Accuracy — KAVACH AI</text>
  <rect class="track" x="20" y="40" width="860" height="12" rx="6"/>
  <g class="fillwrap barA"><rect x="20" y="40" width="860" height="12" rx="6" fill="url(#barGrad)"/></g>
  <text x="895" y="50" class="val">93%</text>

  <!-- Row 2 -->
  <text x="20" y="87" class="lbl">Model Parameter Compression — Evolutionary CNN Pruning</text>
  <rect class="track" x="20" y="97" width="860" height="12" rx="6"/>
  <g class="fillwrap barB"><rect x="20" y="97" width="860" height="12" rx="6" fill="url(#barGrad)"/></g>
  <text x="895" y="107" class="val">60%</text>

  <!-- Row 3 -->
  <text x="20" y="144" class="lbl">Manual Processing Effort Reduced — HRMS, Telangana</text>
  <rect class="track" x="20" y="154" width="860" height="12" rx="6"/>
  <g class="fillwrap barC"><rect x="20" y="154" width="860" height="12" rx="6" fill="url(#barGrad)"/></g>
  <text x="895" y="164" class="val">40%</text>

  <!-- Row 4 -->
  <text x="20" y="201" class="lbl">Inference Latency Reduced — Edge Deployment</text>
  <rect class="track" x="20" y="211" width="860" height="12" rx="6"/>
  <g class="fillwrap barD"><rect x="20" y="211" width="860" height="12" rx="6" fill="url(#barGrad)"/></g>
  <text x="895" y="221" class="val">45%</text>
</svg>
